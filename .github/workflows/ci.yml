name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck API
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck Web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Lint API
        run: npm run lint -w apps/api

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery_test
          POSTGRES_DB: smart_grocery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery -d smart_grocery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://grocery:grocery_test@localhost:5432/smart_grocery_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_test_access_secret
      JWT_REFRESH_SECRET: ci_test_refresh_secret
      ELASTICSEARCH_NODE: http://localhost:9200
      PROMETHEUS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Apply database schema
        # migrate deploy uses committed migrations; fall back to db push while
        # the project has no migrations directory yet.
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma \
            || npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      - name: Run unit tests
        run: npm test -w apps/api

  build-images:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names (GHCR requires lowercase)
        id: meta
        run: |
          echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-api:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.sg' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-web:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
