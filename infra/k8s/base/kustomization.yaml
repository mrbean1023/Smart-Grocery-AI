apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smart-grocery

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: smart-grocery

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - elasticsearch-statefulset.yaml
  - api-hpa.yaml
  - web-hpa.yaml
  - ingress.yaml
