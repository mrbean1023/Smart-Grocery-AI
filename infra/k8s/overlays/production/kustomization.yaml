apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace transformer also renames the Namespace object from the base.
namespace: smart-grocery-prod

resources:
  - ../../base

# Tags are pinned by the deploy workflow (kustomize edit set image <sha|release tag>).
images:
  - name: ghcr.io/OWNER/smart-grocery-api
    newTag: latest
  - name: ghcr.io/OWNER/smart-grocery-web
    newTag: latest

patches:
  - path: configmap-patch.yaml
