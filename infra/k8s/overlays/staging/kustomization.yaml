apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace transformer also renames the Namespace object from the base.
namespace: smart-grocery-staging

resources:
  - ../../base

images:
  - name: ghcr.io/OWNER/smart-grocery-api
    newTag: staging
  - name: ghcr.io/OWNER/smart-grocery-web
    newTag: staging

patches:
  # Staging runs lean: 1 replica, HPA 1-3
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
